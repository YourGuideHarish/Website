/* ================================================================
   DESIGN TOKENS
================================================================ */
:root {
  --bg:           #FDF9F6;
  --surface:      #FFFFFF;
  --surface2:     #F7F3EF;
  --border:       #EDE8E2;
  --text:         #1A1614;
  --text-2:       #6B6560;
  --text-3:       #B0A9A2;
  --accent:       #7C6AF7;
  --accent-light: #F0EEFF;
  --accent-2:     #F97B5B;
  --accent-2-light:#FFF0EB;
  --green:        #3DBF7F;
  --green-light:  #EDFAF4;
  --peach:        #FFB347;
  --peach-light:  #FFF6E8;
  --radius:       16px;
  --radius-sm:    10px;
  --radius-xs:    6px;
  --shadow:       0 2px 16px rgba(0,0,0,0.06);
  --shadow-lg:    0 8px 40px rgba(0,0,0,0.10);
  --transition:   0.22s cubic-bezier(.4,0,.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

h1,h2,h3 { font-family: 'Syne', sans-serif; letter-spacing: -0.02em; }
h1 { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 800; line-height: 1.1; }
h2 { font-size: clamp(1.3rem, 2.5vw, 1.8rem); font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p  { color: var(--text-2); font-weight: 400; }

.container { max-width: 1040px; margin: 0 auto; padding: 0 1.5rem; }
.section    { padding: 4.5rem 0; }
.section-label {
  font-size: 0.68rem; font-weight: 800;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-3); margin-bottom: 0.75rem;
}
.divider { height: 1px; background: var(--border); }

/* ── NAV ── */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(253,249,246,0.9);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem;
}
.nav-inner {
  max-width: 1040px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  height: 58px;
}
.nav-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800; font-size: 1rem;
}
.nav-logo span { color: var(--accent); }
.nav-ig {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.82rem; font-weight: 600; color: var(--text-2);
  background: var(--surface2); border: 1px solid var(--border);
  padding: 0.35rem 0.9rem; border-radius: 100px;
  transition: all var(--transition);
}
.nav-ig:hover { border-color: var(--accent); color: var(--accent); }

/* ── HERO ── */
.hero {
  padding: 4.5rem 0 3.5rem;
  background: linear-gradient(160deg, #F0EEFF 0%, #FDF9F6 55%, #FFF0EB 100%);
  border-bottom: 1px solid var(--border);
}
.hero-inner { display: grid; grid-template-columns: 1fr auto; gap: 2rem; align-items: center; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: var(--accent-light); border: 1px solid #C9C0FF;
  border-radius: 100px; padding: 0.28rem 0.85rem;
  font-size: 0.75rem; font-weight: 700; color: var(--accent);
  margin-bottom: 1.2rem;
}
.hero h1 { margin-bottom: 0.9rem; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero-sub { font-size: 1rem; max-width: 480px; margin-bottom: 2rem; line-height: 1.7; }
.hero-stats { display: flex; gap: 2rem; flex-wrap: wrap; }
.stat-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 0.8rem 1.2rem;
  min-width: 100px;
}
.stat-num {
  font-family: 'Syne', sans-serif;
  font-size: 1.5rem; font-weight: 800; color: var(--text); line-height: 1;
}
.stat-label { font-size: 0.7rem; color: var(--text-3); margin-top: 0.2rem; font-weight: 600; }
.hero-img-wrap {
  width: 160px;
  height: 160px;
  border-radius: 50%;
  overflow:hidden;
  background: linear-gradient(135deg, var(--accent-light), var(--accent-2-light));
  border: 3px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
  flex-shrink: 0;
}

.hero-img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block;
  transform: scale(1.1);
}

/* ── SEARCH ── */
.search-wrap {
  margin: 2.5rem 0 0;
  position: relative; max-width: 480px;
}
.search-input {
  width: 100%; padding: 0.8rem 1rem 0.8rem 2.8rem;
  border: 1.5px solid var(--border); border-radius: 100px;
  background: var(--surface); font-family: 'Nunito', sans-serif;
  font-size: 0.9rem; color: var(--text); outline: none;
  transition: border-color var(--transition);
}
.search-input:focus { border-color: var(--accent); }
.search-icon {
  position: absolute; left: 1rem; top: 50%;
  transform: translateY(-50%); font-size: 0.9rem; pointer-events: none;
}
/* ── TOP TABS ── */
.top-tabs{
  display:flex;
  gap:0.8rem;
  margin-bottom:2rem;
  flex-wrap:wrap;
}

.tab-btn{
  border:none;
  background:var(--surface2);
  color:var(--text-2);
  padding:0.7rem 1.2rem;
  border-radius:100px;
  cursor:pointer;
  font-family:'Nunito',sans-serif;
  font-size:0.85rem;
  font-weight:700;
  transition:all var(--transition);
}

.tab-btn:hover{
  background:var(--accent-light);
  color:var(--accent);
}

.tab-btn.active{
  background:var(--accent);
  color:#fff;
}
/* ── ACCORDION FOLDERS ── */
.folders-wrap { display: flex; flex-direction: column; gap: 1rem; }

.cat-folder {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.cat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.2rem 1.5rem;
  cursor: pointer; user-select: none;
  transition: background var(--transition);
}
.cat-header:hover { background: var(--surface2); }
.cat-header-left { display: flex; align-items: center; gap: 0.85rem; }
.cat-emoji { font-size: 1.5rem; }
.cat-name {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 1.05rem;
}
.cat-count {
  font-size: 0.72rem; font-weight: 700;
  padding: 0.2rem 0.6rem; border-radius: 100px;
  background: var(--surface2); color: var(--text-3);
  margin-left: 0.5rem;
}
.cat-chevron {
  font-size: 0.8rem; color: var(--text-3);
  transition: transform 0.25s ease;
}
.cat-folder.open > .cat-header .cat-chevron { transform: rotate(90deg); }
.cat-body {
  max-height: 0; overflow: hidden;
  transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1);
  border-top: 0px solid var(--border);
}
.cat-folder.open > .cat-body {
  max-height: none;
  border-top: 1.5px solid var(--border);
}
.cat-content { padding: 1.2rem 1.5rem 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }

/* Sub-category */
.subcat {
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--bg);
}
.subcat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.85rem 1.2rem;
  cursor: pointer; user-select: none;
  transition: background var(--transition);
}
.subcat-header:hover { background: var(--surface2); }
.subcat-header-left { display: flex; align-items: center; gap: 0.6rem; }
.subcat-icon { font-size: 1rem; }
.subcat-name {
  font-family: 'Syne', sans-serif;
  font-weight: 700; font-size: 0.88rem; color: var(--text-2);
}
.subcat-count {
  font-size: 0.65rem; font-weight: 700;
  padding: 0.15rem 0.5rem; border-radius: 100px;
  background: var(--border); color: var(--text-3);
  margin-left: 0.4rem;
}
.subcat-chevron {
  font-size: 0.7rem; color: var(--text-3);
  transition: transform 0.25s ease;
}
.subcat.open > .subcat-header .subcat-chevron { transform: rotate(90deg); }
.subcat-body {
  max-height: 0; overflow: hidden;
  transition: max-height 0.32s cubic-bezier(0.4,0,0.2,1);
  border-top: 0px solid var(--border);
}
.subcat.open > .subcat-body {
  max-height: none;
  border-top: 1.5px solid var(--border);
}
.subcat-content {
  padding: 1rem 1.2rem 1.2rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 0.85rem;
}

/* Resource card */
.res-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1.2rem;
  display: flex; flex-direction: column; gap: 0.65rem;
  transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition);
}
.res-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: var(--accent); }
.res-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
.res-type {
  font-size: 0.62rem; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 0.2rem 0.55rem;
  border-radius: var(--radius-xs);
}
.type-pdf    { background: #FFE8E8; color: #D63B3B; }
.type-sheet  { background: #E8F5E9; color: #2E7D32; }
.type-tool   { background: var(--accent-light); color: var(--accent); }
.type-video  { background: #FFF3CD; color: #B45309; }
.type-guide  { background: var(--peach-light); color: #B45309; }
.type-template { background: var(--green-light); color: #1B7A50; }
.res-emoji { font-size: 1.4rem; line-height: 1; }
.res-card h3 { font-size: 0.92rem; line-height: 1.35; }
.res-card p  { font-size: 0.8rem; line-height: 1.55; flex: 1; }
.res-unlock {
  display: flex; align-items: center; justify-content: center; gap: 0.4rem;
  background: var(--accent); color: #fff;
  border: none; border-radius: 100px;
  padding: 0.5rem 1rem; font-family: 'Nunito', sans-serif;
  font-size: 0.8rem; font-weight: 700; cursor: pointer;
  transition: background var(--transition), transform var(--transition);
  width: 100%; margin-top: 0.2rem;
}
.res-unlock:hover { background: #6355E0; transform: translateY(-1px); }
.res-unlock.free {
  background: var(--green-light); color: var(--green);
  border: 1.5px solid #AEECD0;
}
.res-unlock.free:hover { background: var(--green); color: #fff; }

/* ── EMAIL GATE MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(26,22,20,0.55);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface); border-radius: 20px;
  padding: 2.2rem; width: 100%; max-width: 420px;
  margin: 1rem;
  box-shadow: 0 24px 80px rgba(0,0,0,0.18);
  transform: translateY(20px) scale(0.97);
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
  position: relative;
}
.modal-overlay.active .modal { transform: translateY(0) scale(1); }
.modal-close {
  position: absolute; top: 1rem; right: 1rem;
  background: var(--surface2); border: none; border-radius: 50%;
  width: 30px; height: 30px; cursor: pointer;
  font-size: 0.85rem; display: flex; align-items: center; justify-content: center;
  color: var(--text-2); transition: background var(--transition);
}
.modal-close:hover { background: var(--border); }
.modal-emoji { font-size: 2.2rem; margin-bottom: 0.75rem; }
.modal h3 { font-size: 1.15rem; margin-bottom: 0.4rem; }
.modal p  { font-size: 0.88rem; margin-bottom: 1.4rem; }
.modal-resource-name {
  background: var(--accent-light); border: 1px solid #C9C0FF;
  border-radius: var(--radius-xs); padding: 0.5rem 0.85rem;
  font-size: 0.82rem; font-weight: 700; color: var(--accent);
  margin-bottom: 1.2rem; display: inline-block;
}
.modal-form { display: flex; flex-direction: column; gap: 0.75rem; }
.modal-input {
  width: 100%; padding: 0.75rem 1rem;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-family: 'Nunito', sans-serif; font-size: 0.9rem;
  color: var(--text); background: var(--bg); outline: none;
  transition: border-color var(--transition);
}
.modal-input:focus { border-color: var(--accent); }
.modal-submit {
  background: var(--accent); color: #fff;
  border: none; border-radius: 100px;
  padding: 0.75rem 1.5rem; font-family: 'Nunito', sans-serif;
  font-size: 0.92rem; font-weight: 700; cursor: pointer;
  transition: background var(--transition), transform var(--transition);
}
.modal-submit:hover { background: #6355E0; transform: translateY(-1px); }
.modal-note { font-size: 0.72rem; color: var(--text-3); text-align: center; }

/* Success state */
.modal-success {
  text-align: center; padding: 1rem 0;
  display: none; flex-direction: column; align-items: center; gap: 0.75rem;
}
.modal-success.show { display: flex; }
.modal-form.hide { display: none; }
.success-icon { font-size: 2.5rem; }
.success-title { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; }
.success-sub   { font-size: 0.85rem; color: var(--text-2); }
.open-resource {
  background: var(--green); color: #fff;
  border: none; border-radius: 100px;
  padding: 0.7rem 1.4rem; font-family: 'Nunito', sans-serif;
  font-size: 0.88rem; font-weight: 700; cursor: pointer;
  text-decoration: none; display: inline-block;
  transition: background var(--transition);
}
.open-resource:hover { background: #2DA86E; }

/* ── FOOTER ── */
footer {
  padding: 2rem 1.5rem; border-top: 1px solid var(--border);
  text-align: center;
  font-size: 0.78rem; color: var(--text-3);
  max-width: 1040px; margin: 0 auto;
}

/* ── SCROLL REVEAL ── */
.reveal {
  opacity: 0; transform: translateY(18px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  .hero-inner { grid-template-columns: 1fr; }
  .hero-img-wrap { display: none; }
  .hero-stats { gap: 0.75rem; }
  .stat-box { min-width: 80px; }
  .subcat-content{
  grid-template-columns:1fr;
}
}
</style>
</head>

<script>
(function () {
  const C = CONFIG;

  /* ── helpers ── */
  function countResources(node) {
    if (node.link !== undefined) return 1;
    if (!node.children) return 0;
    return node.children.reduce((a, c) => a + countResources(c), 0);
  }

  function typeClass(t) {
    const map = { PDF:'type-pdf', Sheet:'type-sheet', Tool:'type-tool', Video:'type-video', Guide:'type-guide', Template:'type-template' };
    return map[t] || 'type-guide';
  }

  /* ── Resource card ── */
  function makeCard(res) {
    const div = document.createElement('div');
    div.className = 'res-card reveal';
    div.dataset.name = res.name;
    div.dataset.desc = res.description;

    div.innerHTML = `
      <div class="res-card-top">
        <span class="res-emoji">${res.emoji || '📦'}</span>
        <span class="res-type ${typeClass(res.type)}">${res.type || 'Resource'}</span>
      </div>
      <h3>${res.name}</h3>
      <p>${res.description}</p>
      <button class="res-unlock${res.free ? ' free' : ''}" data-name="${res.name}" data-link="${res.link}">
        ${res.free ? '⬇️ Download Free' : '🔓 Unlock Free'}
      </button>
    `;

    div.querySelector('.res-unlock').addEventListener('click', () => {
      if (typeof gtag !== 'undefined') {
          gtag('event', 'resource_click', {
            resource_name: res.name,
            resource_type: res.type,
            page_location: window.location.href
          });
        }

        window.open(res.link, '_blank');
    });

    return div;
  }

  /* ── Subcategory ── */
  function makeSubcat(node) {
    const count = countResources(node);
    const wrap  = document.createElement('div');
    wrap.className = 'subcat open';
    wrap.innerHTML = `
      <div class="subcat-header">
        <div class="subcat-header-left">
          <span class="subcat-icon">${node.icon || '📁'}</span>
          <span class="subcat-name">${node.name}</span>
          <span class="subcat-count">${count}</span>
        </div>
        <span class="subcat-chevron">▶</span>
      </div>
      <div class="subcat-body">
        <div class="subcat-content"></div>
      </div>
    `;
    const content = wrap.querySelector('.subcat-content');
    (node.children || []).forEach(r => content.appendChild(makeCard(r)));
    wrap.querySelector('.subcat-header').addEventListener('click', () => wrap.classList.toggle('open'));
    return wrap;
  }

  /* ── Category folder ── */
  function makeCatFolder(cat) {
    const count = countResources(cat);
    const folder = document.createElement('div');
    folder.className = 'cat-folder open reveal';
    folder.innerHTML = `
      <div class="cat-header">
        <div class="cat-header-left">
          <span class="cat-emoji">${cat.emoji || '📂'}</span>
          <span class="cat-name">${cat.name}</span>
          <span class="cat-count">${count} resources</span>
        </div>
        <span class="cat-chevron">▶</span>
      </div>
      <div class="cat-body">
        <div class="cat-content"></div>
      </div>
    `;
    const content = folder.querySelector('.cat-content');
    (cat.children || []).forEach(sub => {
      if (sub.children) content.appendChild(makeSubcat(sub));
      else content.appendChild(makeCard(sub));
    });
    folder.querySelector('.cat-header').addEventListener('click', () => folder.classList.toggle('open'));
    return folder;
  }

  /* ── Build folders ── */
const fw = document.getElementById('folders-wrap');

/* ── Scroll reveal ── */
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { 
    if (e.isIntersecting) 
      e.target.classList.add('visible'); 
  });
}, { threshold: 0.06 });


function renderFolders(tab){

  fw.innerHTML = '';

  const filtered = C.categories.filter(cat => cat.tab === tab);

  filtered.forEach(cat => {
    fw.appendChild(makeCatFolder(cat));
  });

}
  function renderFolders(tab){

  fw.innerHTML = '';

  const filtered = C.categories.filter(cat => cat.tab === tab);

  filtered.forEach(cat => {
    fw.appendChild(makeCatFolder(cat));
  });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
}

renderFolders('Tools');
  /* ── Tabs ── */

document.querySelectorAll('.tab-btn').forEach(btn => {

  btn.addEventListener('click', () => {

    document.querySelectorAll('.tab-btn')
      .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    renderFolders(btn.dataset.tab);

  });

});
  /* ── Nav ── */
  const logoEl = document.getElementById('nav-logo');
  const words  = C.name.split(' ');
  logoEl.innerHTML = words.map((w,i) => i === 0 ? `<span style="color:var(--accent)">${w}</span>` : ' ' + w).join('');
  document.getElementById('nav-ig').href        = C.ig_link;
  document.getElementById('nav-ig-text').textContent = C.instagram;

  /* ── Hero ── */
  document.getElementById('hero-badge').innerHTML = `📸 ${C.instagram} · Free Resources`;
  document.getElementById('hero-h1').innerHTML    = C.name.replace('Harish','<em>Harish</em>');
  document.getElementById('hero-sub').textContent = C.tagline;

  const statsEl = document.getElementById('hero-stats');
  C.stats.forEach(s => {
    statsEl.innerHTML += `<div class="stat-box"><div class="stat-num">${s.num}</div><div class="stat-label">${s.label}</div></div>`;
  });

  /* ── Resources heading ── */
  const total = C.categories.reduce((a, c) => a + countResources(c), 0);
  document.getElementById('resources-heading').textContent = `${total} free resources`;
  document.getElementById('resources-sub').textContent     = 'Click any category to explore. Submit your email once to unlock any resource.';

  /* ── Footer ── */
  document.getElementById('footer').innerHTML = `© ${new Date().getFullYear()} ${C.name} · Made with ❤️ for ${C.instagram}`;

  /* ── Modal ── */
  const overlay  = document.getElementById('modal-overlay');
  const modalClose = document.getElementById('modal-close');
  const modalForm  = document.getElementById('modal-form');
  const modalSuccess = document.getElementById('modal-success');
  const resNameEl  = document.getElementById('modal-resource-name');
  const resourceField = document.getElementById('form-resource-field');
  const openBtn    = document.getElementById('open-resource-btn');
  let pendingLink  = '#';

  function openModal(name, link) {
    pendingLink = link;
    resNameEl.textContent = name;
    resourceField.value   = name;
    modalForm.classList.remove('hide');
    modalSuccess.classList.remove('show');
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  modalClose.addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  modalForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = modalForm.querySelector('.modal-submit');
    btn.textContent = 'Sending...'; btn.disabled = true;
    try {
      const data = new FormData(modalForm);
      await fetch(C.formspree, { method:'POST', body: data, headers:{ 'Accept': 'application/json' } });
    } catch(_) {}
    // Show success regardless (graceful)
    modalForm.classList.add('hide');
    modalSuccess.classList.add('show');
    openBtn.href = pendingLink;
  });

  /* ── Search ── */
  const searchInput   = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');

  function getAllResources() {
    const all = [];
    function walk(node) {
      if (node.link !== undefined) { all.push(node); return; }
      (node.children || []).forEach(walk);
    }
    C.categories.forEach(walk);
    return all;
  }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) {
      searchResults.style.display = 'none';
      fw.style.display = '';
      return;
    }
    fw.style.display = 'none';
    searchResults.style.display = '';
    const matches = getAllResources().filter(r =>
      r.name.toLowerCase().includes(q) || r.description.toLowerCase().includes(q) || (r.type||'').toLowerCase().includes(q)
    );
    if (!matches.length) {
      searchResults.innerHTML = `<p style="color:var(--text-3);font-size:0.9rem;padding:1rem 0;">No resources found for "${q}".</p>`;
      return;
    }
    searchResults.innerHTML = `<p style="font-size:0.8rem;color:var(--text-3);margin-bottom:1rem;">${matches.length} result${matches.length>1?'s':''} for "${q}"</p>`;
    const grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0.85rem;';
    matches.forEach(r => grid.appendChild(makeCard(r)));
    searchResults.appendChild(grid);
    // re-observe new cards
    grid.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  });


  setTimeout(() => {
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
}, 100);
})();
</script>
